name: Publicar versión

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: APK para instalar
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceptar licencias Android SDK
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Dar permisos al lanzador
        run: chmod +x gradlew

      - name: Compilar APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CircuitNexus.apk

      - name: Crear release con el APK
        uses: softprops/action-gh-release@v2
        with:
          files: CircuitNexus.apk
          generate_release_notes: true
          body: |
            Instala **CircuitNexus.apk** en tu Android (8.0 o superior).

            1. Descarga el archivo APK.
            2. Abre el archivo y permite "instalar desde esta fuente".
            3. Listo, abre CircuitNexus y crea tu primer circuito.
